[tool.poetry]
name = "machine-control-backend"
version = "0.1.0"
description = "Backend for Machine Control Panel (FastAPI)"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.116.1"
uvicorn = "0.35.0"
requests = "2.32.5"
python-dotenv = "^1.0.0"
httpx = "^0.27.0"
tenacity = "^8.2.2"

[tool.poetry.dev-dependencies]
pytest = "^7.0"
black = "^23.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
